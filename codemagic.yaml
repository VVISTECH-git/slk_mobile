# Codemagic CI/CD for SLK Mobile (Flutter).
# ---------------------------------------------------------------------------
# Two workflows: Android (APK + AAB) and iOS (IPA → TestFlight). The app points
# at the live API by default (lib/core/config.dart → Render URL); override per
# build with --dart-define=API_BASE_URL=... if you need staging.
#
# ONE-TIME SETUP in the Codemagic UI (nothing here needs your password in the repo):
#   • Connect this GitHub repo to a Codemagic app.
#   • Android signing: Teams → Code signing identities → Android keystores →
#     upload upload-keystore.jks, and name the reference  slk_keystore
#     (alias/passwords from when the keystore was created).
#   • iOS signing: add an App Store Connect API key integration named
#     slk_app_store_connect  (Integrations → App Store Connect).
#   • Google Play (optional): add a service-account JSON, referenced below.
#   • Set a real notification email under the `publishing` blocks if wanted.
# ---------------------------------------------------------------------------

workflows:
  # =========================================================================
  # ANDROID — signed APK + AAB, ready for Google Play
  # =========================================================================
  android-workflow:
    name: Android (APK + AAB)
    # mac_mini_m2 is what the account's plan allows (same instance the other
    # VVIS apps build on). Android builds fine on macOS instances.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        # Name of the Android keystore reference in Codemagic → Code signing
        # identities (this must match exactly what you named it there).
        - slk
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Static analysis
        # Fail on real errors only; info/style lints don't block the build.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Write key.properties from the Codemagic keystore
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build APK + AAB
        script: |
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once a Google Play service-account JSON is added in Codemagic:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  # =========================================================================
  # iOS — signed IPA → TestFlight (runs on a Mac, so it works from Windows too)
  # =========================================================================
  ios-workflow:
    name: iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: "VVIS Codemagic" # App Store Connect API key (Key: V3NW8K9FQ9)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.vvistech.slkMobile"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Static analysis
        # Fail on real errors only; info/style lints don't block the build.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (create cert + App Store profile)
        # Create a NEW distribution certificate (now that a slot is free) that
        # this machine owns the private key for, then CREATE the App Store
        # provisioning profile for the bundle id and load both into the keychain.
        script: |
          keychain initialize
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "── Signing identities in keychain: ──"
          security find-identity -v -p codesigning
          xcode-project use-profiles
      - name: Build IPA
        # xcode-project build-ipa archives with the manual profile and skips
        # Flutter's bogus development-certificate pre-check.
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false
