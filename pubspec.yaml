name: slk_mobile
description: "Sree Lakshmi Kalamkari — inventory & billing (mobile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Barcode / QR scanning (POS + stock)
  mobile_scanner: ^6.0.2

  # Tax-invoice PDF + print/share
  pdf: ^3.11.1
  printing: ^5.13.4

  # Misc UI helpers
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icon generation
  flutter_launcher_icons: ^0.14.1
  image: ^4.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#B5533B"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
